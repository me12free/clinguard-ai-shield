      <ellipse cx="1350" cy="578" rx="54" ry="11" fill="#fff7ed" stroke="#c2410c"/>
      <text x="1350" y="582" text-anchor="middle" font-size="7.5" fill="#c2410c">event_date</text>
      <ellipse cx="1350" cy="614" rx="58" ry="11" fill="#fff7ed" stroke="#c2410c"/>
