    <path d="M665 316 L800 316 L800 248" stroke="#475569"/>
    <rect x="484" y="464" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="491" y="473" text-anchor="middle" font-size="8.5">1</text>
    <rect x="786" y="266" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="793" y="275" text-anchor="middle" font-size="8.5">N</text>
    <!-- generates (CONVERSATIONS ↔ AUDIT_EVENTS) -->
