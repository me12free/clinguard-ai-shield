  <text x="48" y="1004" font-size="12" font-weight="700" fill="#0f172a" font-family="system-ui, 'Segoe UI', sans-serif">Legend</text>
  <g font-family="system-ui, 'Segoe UI', sans-serif" font-size="9.5" fill="#334155">
