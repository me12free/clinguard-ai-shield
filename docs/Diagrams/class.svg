  <text x="720" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" font-family="system-ui, 'Segoe UI', sans-serif">ClinGuard — Chen ER Diagram (Refined)</text>
  <text x="720" y="56" text-anchor="middle" font-size="10" fill="#475569" font-family="system-ui, 'Segoe UI', sans-serif">Clear entity–attribute connections • Orthogonal relationship paths • No dangling lines or overlaps</text>

  <!-- Background grouping (visual zones) -->
  <g font-family="system-ui, 'Segoe UI', sans-serif">
    <rect x="30" y="80" width="620" height="340" rx="20" fill="#fffbeb" fill-opacity="0.7" stroke="#f59e0b" stroke-width="1.2"/>
