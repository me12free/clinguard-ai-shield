    <path d="M1003 468 L1080 468 L1080 560" stroke="#475569"/>
    <rect x="894" y="378" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="901" y="387" text-anchor="middle" font-size="8.5">1</text>
    <rect x="1068" y="544" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="1075" y="553" text-anchor="middle" font-size="8.5">N</text>
