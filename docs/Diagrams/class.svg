    <!-- configures (ORG ↔ POL) -->
    <polygon points="398,224 425,252 398,280 371,252" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.4"/>
    <text x="398" y="256" text-anchor="middle" font-size="8.5" font-weight="700" fill="#4c1d95">configures</text>
    <path d="M550 188 L550 224 L425 224" stroke="#475569"/>
    <path d="M371 252 L345 252 L345 280" stroke="#475569"/>
    <rect x="537" y="208" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="544" y="217" text-anchor="middle" font-size="8.5">1</text>
    <rect x="358" y="266" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="365" y="275" text-anchor="middle" font-size="8.5">N</text>
    <!-- employs (ORG ↔ USERS) -->
    <polygon points="518,352 545,380 518,408 491,380" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.4"/>
    <text x="518" y="384" text-anchor="middle" font-size="9" font-weight="700" fill="#4c1d95">employs</text>
    <path d="M550 188 L550 352 L518 352" stroke="#475569"/>
    <path d="M518 408 L518 440 L498 440" stroke="#475569"/>
    <rect x="535" y="334" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="542" y="343" text-anchor="middle" font-size="8.5">1</text>
    <rect x="505" y="422" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="512" y="431" text-anchor="middle" font-size="8.5">N</text>
    <!-- assigned_to (ROLES ↔ USERS) -->
    <polygon points="332,452 359,480 332,508 305,480" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.4"/>
    <text x="332" y="484" text-anchor="middle" font-size="7.5" font-weight="700" fill="#4c1d95">assigned_to</text>
    <path d="M204 508 L204 480 L305 480" stroke="#475569"/>
    <path d="M359 480 L440 480 L440 464" stroke="#475569"/>
    <rect x="192" y="468" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="199" y="477" text-anchor="middle" font-size="8.5">1</text>
    <rect x="426" y="452" width="14" height="12" rx="2" fill="white" stroke="#94a3b8"/><text x="433" y="461" text-anchor="middle" font-size="8.5">N</text>
