      <text x="370" y="548" text-anchor="middle" font-size="7.5" font-weight="600" fill="#065f46"><tspan text-decoration="underline">id</tspan> PK</text>
      <ellipse cx="456" cy="544" rx="58" ry="11" fill="#ecfdf5" stroke="#047857"/>
      <text x="456" y="548" text-anchor="middle" font-size="7.5" fill="#047857">org_id FK</text>
