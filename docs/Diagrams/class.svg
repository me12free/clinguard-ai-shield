<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1080" width="100%" overflow="visible">
  <defs>
    <linearGradient id="erdChenBg" x1="0" y1="0" x2="1440" y2="1080" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="softShadow" x="-0.02" y="-0.02" width="1.04" height="1.04">
