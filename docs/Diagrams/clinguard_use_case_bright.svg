<svg width="100%" viewBox="0 0 720 1000" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="ucBgBright" x1="0" y1="0" x2="720" y2="1000" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#e8f2ff"/>
    <stop offset="42%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f0fdf8"/>
  </linearGradient>
  <marker id="ucArrowOpen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="720" height="1000" fill="url(#ucBgBright)"/>
<rect x="14" y="10" width="692" height="980" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.9"/>

<text x="360" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a" font-family="system-ui, Segoe UI, sans-serif">ClinGuard - use case diagram</text>
<text x="360" y="40" text-anchor="middle" fill="#64748b" font-size="9.5" font-family="system-ui, Segoe UI, sans-serif">UML: actors (stick figures) associate with use cases (ellipses) inside the system boundary.</text>

<!-- System boundary -->
<rect x="168" y="52" width="384" height="758" rx="10" fill="#f8fafc" fill-opacity="0.65" stroke="#64748b" stroke-width="1.5" stroke-dasharray="8 5"/>
<text x="360" y="72" text-anchor="middle" dominant-baseline="central" fill="#334155" font-size="12" font-weight="600" font-family="system-ui, Segoe UI, sans-serif">ClinGuard system</text>

<g font-family="system-ui, Segoe UI, sans-serif">
  <!-- Association lines (behind ellipses); x=248 is left edge of rx=112 ovals -->
  <g stroke="#94a3b8" stroke-width="1.1" fill="none">
    <line x1="72" y1="378" x2="244" y2="118"/>
    <line x1="72" y1="378" x2="244" y2="166"/>
    <line x1="72" y1="378" x2="244" y2="214"/>
    <line x1="72" y1="378" x2="248" y2="254"/>
    <line x1="72" y1="378" x2="248" y2="312"/>
    <line x1="72" y1="378" x2="248" y2="370"/>
    <line x1="72" y1="378" x2="248" y2="428"/>
    <line x1="72" y1="378" x2="248" y2="486"/>
    <line x1="72" y1="378" x2="248" y2="544"/>
    <line x1="72" y1="592" x2="248" y2="602"/>
    <line x1="72" y1="592" x2="248" y2="660"/>
    <line x1="618" y1="688" x2="472" y2="718"/>
    <line x1="618" y1="688" x2="472" y2="776"/>
    <line x1="618" y1="688" x2="472" y2="660"/>
    <line x1="618" y1="312" x2="472" y2="312"/>
    <line x1="618" y1="312" x2="472" y2="370"/>
    <line x1="618" y1="456" x2="472" y2="428"/>
    <line x1="618" y1="456" x2="472" y2="486"/>
  </g>

  <!-- Auth -->
  <ellipse cx="360" cy="118" rx="92" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="360" y="118" text-anchor="middle" dominant-baseline="central" fill="#1e3a8a" font-size="13" font-weight="600">Login</text>
  <ellipse cx="360" cy="166" rx="92" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="360" y="166" text-anchor="middle" dominant-baseline="central" fill="#1e3a8a" font-size="13" font-weight="600">Register</text>
  <ellipse cx="360" cy="214" rx="92" ry="22" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
  <text x="360" y="214" text-anchor="middle" dominant-baseline="central" fill="#1e3a8a" font-size="13" font-weight="600">Logout</text>

  <!-- Clinical / PHI (58px center spacing: 14px gap between ry=22 ovals) -->
  <ellipse cx="360" cy="254" rx="112" ry="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="360" y="254" text-anchor="middle" dominant-baseline="central" fill="#5b21b6" font-size="12.5" font-weight="600">Compose clinical notes</text>
  <ellipse cx="360" cy="312" rx="112" ry="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="360" y="312" text-anchor="middle" dominant-baseline="central" fill="#5b21b6" font-size="12.5" font-weight="600">Review PHI detection</text>
  <ellipse cx="360" cy="370" rx="112" ry="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="360" y="370" text-anchor="middle" dominant-baseline="central" fill="#5b21b6" font-size="12.5" font-weight="600">Apply redaction</text>
  <ellipse cx="360" cy="428" rx="112" ry="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="360" y="428" text-anchor="middle" dominant-baseline="central" fill="#5b21b6" font-size="12.5" font-weight="600">Submit prompt to AI</text>
  <ellipse cx="360" cy="486" rx="112" ry="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
  <text x="360" y="486" text-anchor="middle" dominant-baseline="central" fill="#5b21b6" font-size="12.5" font-weight="600">View RAG context</text>

  <ellipse cx="360" cy="544" rx="112" ry="22" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="360" y="544" text-anchor="middle" dominant-baseline="central" fill="#065f46" font-size="12.5" font-weight="600">Emergency bypass</text>

  <!-- Admin -->
  <ellipse cx="360" cy="602" rx="112" ry="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="360" y="602" text-anchor="middle" dominant-baseline="central" fill="#9a3412" font-size="12.5" font-weight="600">Configure policies</text>
  <ellipse cx="360" cy="660" rx="112" ry="22" fill="#ffedd5" stroke="#ea580c" stroke-width="1.2"/>
  <text x="360" y="660" text-anchor="middle" dominant-baseline="central" fill="#9a3412" font-size="12.5" font-weight="600">View audit logs</text>
  <ellipse cx="360" cy="718" rx="112" ry="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="360" y="718" text-anchor="middle" dominant-baseline="central" fill="#92400e" font-size="12.5" font-weight="600">Manage users</text>
  <ellipse cx="360" cy="776" rx="118" ry="22" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
  <text x="360" y="776" text-anchor="middle" dominant-baseline="central" fill="#92400e" font-size="12" font-weight="600">Manage organisations</text>

  <!-- Include: visible vertical segments in gaps between ovals -->
  <g stroke="#64748b" stroke-width="1.05" fill="none" stroke-dasharray="5 3" marker-end="url(#ucArrowOpen)">
    <line x1="360" y1="278" x2="360" y2="290"/>
    <line x1="360" y1="336" x2="360" y2="348"/>
    <line x1="360" y1="394" x2="360" y2="406"/>
    <line x1="360" y1="452" x2="360" y2="464"/>
  </g>
  <text x="378" y="287" fill="#475569" font-size="11" font-style="italic">&#171;include&#187;</text>
  <text x="378" y="345" fill="#475569" font-size="11" font-style="italic">&#171;include&#187;</text>
  <text x="378" y="403" fill="#475569" font-size="11" font-style="italic">&#171;include&#187;</text>
  <text x="378" y="461" fill="#475569" font-size="11" font-style="italic">&#171;include&#187;</text>

  <!-- Extend: Emergency bypass -> Submit (route along right rim to avoid crossing View RAG) -->
  <path d="M360 522 L472 522 L472 428" fill="none" stroke="#64748b" stroke-width="1.05" stroke-dasharray="5 3" marker-end="url(#ucArrowOpen)"/>
  <text x="378" y="516" fill="#475569" font-size="11" font-style="italic">&#171;extend&#187;</text>
</g>

<!-- Actors -->
<g stroke="#334155" stroke-width="1.5" fill="none" font-family="system-ui, Segoe UI, sans-serif">
  <circle cx="58" cy="378" r="14"/>
  <line x1="58" y1="392" x2="58" y2="428"/>
  <line x1="36" y1="408" x2="80" y2="408"/>
  <line x1="58" y1="428" x2="42" y2="452"/>
  <line x1="58" y1="428" x2="74" y2="452"/>
  <text x="58" y="468" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">Clinician</text>

  <circle cx="58" cy="592" r="14"/>
  <line x1="58" y1="606" x2="58" y2="642"/>
  <line x1="36" y1="622" x2="80" y2="622"/>
  <line x1="58" y1="642" x2="42" y2="666"/>
  <line x1="58" y1="642" x2="74" y2="666"/>
  <text x="58" y="682" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">Security admin</text>

  <circle cx="628" cy="688" r="14"/>
  <line x1="628" y1="702" x2="628" y2="738"/>
  <line x1="606" y1="718" x2="650" y2="718"/>
  <line x1="628" y1="738" x2="612" y2="762"/>
  <line x1="628" y1="738" x2="644" y2="762"/>
  <text x="628" y="778" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">System admin</text>

  <circle cx="628" cy="312" r="14"/>
  <line x1="628" y1="326" x2="628" y2="362"/>
  <line x1="606" y1="342" x2="650" y2="342"/>
  <line x1="628" y1="362" x2="612" y2="386"/>
  <line x1="628" y1="362" x2="644" y2="386"/>
  <text x="628" y="402" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">Detection system</text>

  <circle cx="628" cy="456" r="14"/>
  <line x1="628" y1="470" x2="628" y2="506"/>
  <line x1="606" y1="486" x2="650" y2="486"/>
  <line x1="628" y1="506" x2="612" y2="530"/>
  <line x1="628" y1="506" x2="644" y2="530"/>
  <text x="628" y="544" text-anchor="middle" fill="#334155" font-size="11.5" font-weight="600">OpenAI API</text>
</g>

<!-- Legend -->
<rect x="32" y="848" width="656" height="136" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="872" fill="#0f172a" font-size="12" font-weight="700" font-family="system-ui, Segoe UI, sans-serif">UML use case notation</text>

<line x1="48" y1="888" x2="92" y2="888" stroke="#94a3b8" stroke-width="1.1"/>
<text x="100" y="892" dominant-baseline="central" fill="#334155" font-size="10.5" font-family="system-ui, Segoe UI, sans-serif">Association - actor participates in a use case (solid line)</text>

<line x1="48" y1="908" x2="92" y2="908" stroke="#64748b" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ucArrowOpen)"/>
<text x="100" y="912" dominant-baseline="central" fill="#334155" font-size="10.5" font-family="system-ui, Segoe UI, sans-serif">&#171;include&#187; - mandatory sub-behaviour (dashed, open arrow to included use case)</text>

<line x1="48" y1="928" x2="92" y2="928" stroke="#64748b" stroke-width="1" stroke-dasharray="5 3" marker-end="url(#ucArrowOpen)"/>
<text x="100" y="932" dominant-baseline="central" fill="#334155" font-size="10.5" font-family="system-ui, Segoe UI, sans-serif">&#171;extend&#187; - optional extension toward base use case</text>

<text x="48" y="954" fill="#64748b" font-size="9.5" font-family="system-ui, Segoe UI, sans-serif">
  <tspan x="48" dy="0">Generalization (not shown): hollow triangle on solid line to parent actor or use case.</tspan>
  <tspan x="48" dy="13">Actors: Clinician, Security admin, System admin, Detection system, OpenAI API.</tspan>
</text>
</svg>
