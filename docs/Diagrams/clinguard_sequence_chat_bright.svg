<!-- Legend: UML notation key -->
<rect x="28" y="1008" width="664" height="228" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="48" y="1032" fill="#0f172a" font-size="12" font-weight="700" font-family="system-ui, Segoe UI, sans-serif">UML sequence notation (this diagram)</text>

<line x1="48" y1="1048" x2="88" y2="1048" stroke="#1e40af" stroke-width="1.45" marker-end="url(#arrowSync)"/>
<text x="96" y="1052" dominant-baseline="central" fill="#334155" font-size="10.5" font-family="system-ui, Segoe UI, sans-serif">Synchronous - solid line, filled arrow (caller waits)</text>

<line x1="48" y1="1068" x2="88" y2="1068" stroke="#1e40af" stroke-width="1.45" marker-end="url(#arrowAsyncOpen)"/>
<text x="96" y="1072" dominant-baseline="central" fill="#334155" font-size="10.5" font-family="system-ui, Segoe UI, sans-serif">Asynchronous - solid line, open arrow (caller continues)</text>

<line x1="48" y1="1088" x2="88" y2="1088" stroke="#64748b" stroke-width="1.2" stroke-dasharray="2 5" marker-end="url(#arrowReturnOpen)"/>
<text x="96" y="1092" dominant-baseline="central" fill="#334155" font-size="10.5" font-family="system-ui, Segoe UI, sans-serif">Return / reply - dotted line, open arrow</text>

<text x="48" y="1112" fill="#475569" font-size="10.5" font-family="system-ui, Segoe UI, sans-serif">
  <tspan x="48" dy="0">Lifeline - dashed vertical line = object existence over time (participants / actors across the top).</tspan>
  <tspan x="48" dy="14">Execution occurrence - narrow shaded rectangle on a lifeline = focus of control while processing.</tspan>
  <tspan x="48" dy="14">Combined fragments - alt (alternatives), loop (iteration), opt (optional) in dashed regions with guards in [ ].</tspan>
  <tspan x="48" dy="14">Creation / destruction - not used in main flow above; see miniature examples below.</tspan>
</text>

<!-- Illustrative create / destroy (aligned below text, inside legend box) -->
<g font-family="system-ui, Segoe UI, sans-serif" fill="#64748b">
  <text x="48" y="1176" font-size="9.5" font-style="italic" fill="#64748b">Illustrative only (UML reference):</text>
  <!-- creation: message to new object box -->
  <line x1="52" y1="1198" x2="92" y2="1198" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arrowSync)"/>
  <rect x="98" y="1186" width="34" height="24" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <text x="140" y="1202" dominant-baseline="central" fill="#475569" font-size="9.5" font-style="normal">new object</text>
  <text x="140" y="1214" font-size="8.5" font-style="normal">&#171;create&#187;</text>
  <!-- destruction: lifeline ends at stereotypical X (UML object termination) -->
  <line x1="322" y1="1184" x2="322" y2="1200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <path d="M 314 1200 L 330 1216 M 330 1200 L 314 1216" fill="none" stroke="#334155" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="340" y="1210" dominant-baseline="central" font-size="9.5" font-style="normal" fill="#475569">destruction</text>
</g>
</svg>
