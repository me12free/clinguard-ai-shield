  <text x="545" y="68" text-anchor="middle" dominant-baseline="central" fill="#92400e" font-size="12.5" font-weight="600">OpenAI</text>
</g>
<g font-family="system-ui, Segoe UI, sans-serif">
  <rect x="594" y="46" width="78" height="40" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
  <text x="633" y="68" text-anchor="middle" dominant-baseline="central" fill="#334155" font-size="12.5" font-weight="600">Database</text>
</g>

