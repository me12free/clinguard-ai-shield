<svg width="100%" viewBox="0 0 720 1240" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="seqBgBright" x1="0" y1="0" x2="720" y2="1240" gradientUnits="userSpaceOnUse">
    <stop offset="0%" stop-color="#e8f2ff"/>
    <stop offset="42%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#f0fdf8"/>
  </linearGradient>
  <!-- UML: synchronous call — solid line + filled (closed) arrowhead; caller blocks until reply -->
  <marker id="arrowSync" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="6" orient="auto-start-reverse">
    <path d="M0 0 L10 4 L0 8 Z" fill="#1e40af"/>
  </marker>
  <!-- UML: asynchronous message — solid line + open arrowhead; caller does not wait for completion -->
  <marker id="arrowAsyncOpen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#1e40af" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <!-- UML: reply / return — typically dotted + open arrowhead -->
  <marker id="arrowReturnOpen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="720" height="1240" fill="url(#seqBgBright)"/>
<rect x="14" y="10" width="692" height="1220" rx="12" fill="none" stroke="#cbd5e1" stroke-width="1" opacity="0.9"/>

<text x="360" y="22" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#0f172a" font-family="system-ui, Segoe UI, sans-serif">ClinGuard - sequence diagram</text>
<text x="360" y="38" text-anchor="middle" fill="#64748b" font-size="9.5" font-family="system-ui, Segoe UI, sans-serif">UML: time progresses downward; dashed vertical lifelines = object existence over time.</text>

<!-- ===== LIFELINE HEADERS ===== -->
<g font-family="system-ui, Segoe UI, sans-serif">
