</g>
<g font-family="system-ui, Segoe UI, sans-serif">
  <rect x="318" y="46" width="84" height="40" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.2"/>
  <text x="360" y="68" text-anchor="middle" dominant-baseline="central" fill="#065f46" font-size="12.5" font-weight="600">Detection</text>
